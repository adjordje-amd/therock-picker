[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "therock-picker"
version = "0.2.0"
description = "TUI to browse local and remote AMD TheRock (ROCm) builds and download a selected one"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.60",
]

[project.scripts]
therock-picker = "therock_picker.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
